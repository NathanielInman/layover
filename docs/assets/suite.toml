# What dot-files needs to know about Layover. Its README is built from this
# file (docs/bar/build.py in NathanielInman/dotfiles reads it beside the
# hero), so a change here reaches that README on its next build.

name = "Layover"
repo = "https://github.com/NathanielInman/layover"
language = "Rust"
# Its module in packages/waybar/.config/waybar/config.jsonc.
module = "custom/layover"
# "Layover for <purpose>" in the README's list of the suite.
purpose = "the screensaver and idle"
# The "In the bar" cell of the suite table.
lamp = "The moon: dim while armed, amber while something holds the screen on"
# Scripts and programs it replaced. dot-files' build fails if a doc still
# mentions one outside a sentence that says it was replaced.
retired = [
  "hypridle",
]
# Its stow package in dot-files, or "" when it needs none.
stow = ""
# Install from a clean Arch machine, run in order.
install = [
  "sudo pacman -S --needed gtk4 gtk4-layer-shell vulkan-icd-loader libpulse",
  "git clone https://github.com/NathanielInman/layover.git ~/Sites/layover",
  "cd ~/Sites/layover && cargo build --release --locked",
  "install -Dm755 target/release/layover target/release/layover-board -t ~/.local/bin/",
  "install -Dm644 packaging/systemd/layover.service -t ~/.config/systemd/user/",
  "sed -i 's|^ExecStart=.*|ExecStart=%h/.local/bin/layover daemon|' ~/.config/systemd/user/layover.service",
  "systemctl --user enable --now layover.service",
]
# Run after installing (and stowing) to check the setup.
check = [
  "layover doctor",
]
