name: CI

on:
  push:
    branches: [main]
    # Docs, pictures and notes never change a build.
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "Pictures/**"
      - "artwork/**"
      - "LICENSE"
      - "AGENTS.md"
  pull_request:
    # Docs, pictures and notes never change a build.
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "Pictures/**"
      - "artwork/**"
      - "LICENSE"
      - "AGENTS.md"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  PKG_CONFIG_PATH: /usr/local/lib/x86_64-linux-gnu/pkgconfig:/usr/local/lib/pkgconfig

jobs:
  test:
    name: test (linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      # libwayland for the client; Mesa's lavapipe so the wear test has a
      # Vulkan adapter (never skip the wear test here: it is rule five);
      # GTK4 and gtk4-layer-shell, built from source, for the drawer.
      - name: Libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwayland-dev mesa-vulkan-drivers libvulkan1
          .github/scripts/gtk4-layer-shell.sh
      - name: Build
        run: cargo build --workspace --locked
      - name: Test
        run: cargo test --workspace --locked -- --nocapture
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  deny:
    name: dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
