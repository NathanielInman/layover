[package]
name = "layover-board"
description = "Layover's drawer: the GTK4 layer-shell panel that opens from the moon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

# The layer-shell drawer is Linux only.
[target.'cfg(target_os = "linux")'.dependencies]
layover-core = { path = "../layover-core" }
bar-anchor.workspace = true
gtk = { package = "gtk4", version = "0.11", features = ["v4_12"] }
gtk4-layer-shell = "0.8"
async-channel = "2"
serde_json.workspace = true
libc.workspace = true
